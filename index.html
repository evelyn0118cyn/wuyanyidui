<script>
/* 可选：SheetJS（用于 .xlsx 解析）。通过 CDN 加载；离线时自动降级为仅支持 CSV。 */
(function () {
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
  s.onerror = function () { console.warn('[财务舞弊111] SheetJS 未加载，Excel 上传不可用，可改用 CSV。'); };
  s.async = true;
  document.head.appendChild(s);
})();

/* 启动 */
document.addEventListener('DOMContentLoaded', function () {
  try {
    App.boot();
  } catch (e) {
    console.error(e);
    document.getElementById('app').innerHTML =
      '<div style="padding:40px;font-family:sans-serif">' +
      '<h2 style="color:#D93025">启动失败</h2>' +
      '<pre style="background:#FEF7F6;padding:16px;border-radius:8px;white-space:pre-wrap">' + (e.stack || e.message) + '</pre>' +
      '<p style="color:#6B6780">请按 F12 打开控制台查看详细错误，或重新双击 start.bat 启动。</p></div>';
  }
});
</script>
